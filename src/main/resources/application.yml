spring:
  application:
    name: ebaez-web-crawler
  datasource:
    url: jdbc:h2:file:./data/hn-crawler;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

hn:
  crawler:
    url: https://news.ycombinator.com/
    user-agent: ebaez-web-crawler/0.1 (+StackBuilders interview exercise)
    timeout-ms: 10000
    limit: 30
